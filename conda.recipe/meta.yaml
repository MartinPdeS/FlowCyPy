package:
  name: flowcypy
  version: "1.2.13"

source:
  # Build the checked-out revision selected by the reusable workflow.
  path: ..

build:
  number: 0
  script: |
    @echo on  # [win]
    "%PYTHON%" -m pip install . -vv --no-deps --no-build-isolation ^  # [win]
      "--config-settings=cmake.args=-GNinja;-DCMAKE_Fortran_COMPILER=flang;-DCMAKE_LINKER=link;-DCMAKE_RC_COMPILER=rc;-DCMAKE_MT=mt" ^  # [win]
      || exit /b 1  # [win]

    "${PYTHON}" -m pip install . -vv --no-deps --no-build-isolation  # [unix]

requirements:
  build:
    - "{{ compiler('c') }}"
    - "{{ compiler('cxx') }}"
    - vs2022_win-64          # [win]
    - flang_win-64           # [win]
    - ninja
    - cmake
    - "{{ compiler('fortran') }}"  # [unix]
    - fftw
  host:
    - python {{ PY_VER }}*
    - scikit-build-core ~=0.3
    - pybind11 ~=2.13  # [py<314]
    - pybind11 >=3.0.1,<4  # [py>=314]
    - python-build ~=1.2
    - numpy >=2.0,<3  # [py<314]
    - numpy >=2.3.3,<3  # [py>=314]
    - fftw
    - pip
  run:
    - pip
    - python {{PY_VER}}*
    - pandas ~=2.2  # [py<314]
    - pandas >=2.3.3,<4  # [py>=314]
    - seaborn ~=0.13
    - pydantic ~=2.9
    - numpy >=2.0  # [py<314]
    - numpy >=2.3.3,<3  # [py>=314]
    - pint >=0.24,<0.26
    - martinpdes::pymiesim >=6.0.4,<6.1
    - martinpdes::mpsplots >=1.8.9
    - martinpdes::typedunit >=0.2.9

about:
  home: https://github.com/MartinPdeS/FlowCyPy
  license: MIT
  summary: "A package for flow-cytometry simulations."
  description: FlowCyPy is a library that simulate source - scatterer - detector systems in the context of flow-cytometry systems.
  dev_url: https://github.com/MartinPdeS/FlowCyPy
  doc_url: https://martinpdes.github.io/FlowCyPy/
  license_file: LICENSE
  keywords:
    - optics
    - refractive index
    - material
    - microbeads
    - Mie scattering

files:
  include:
    - "FlowCyPy/*.so"

test:
  imports:
    - FlowCyPy
  requires:
    - python {{ PY_VER }}*
    - python_abi 3.13.* *_cp313   # [py==313]
    - python_abi 3.14.* *_cp314   # [py==314]
    - pytest >=0.6
    - pytest-cov >=2.0
    - pytest-json-report ==1.5
    - coverage ==7.6
  commands:
    - python -m pytest --config-file=./pytest.ini
  source_files:
    - tests
    - pytest.ini

extra:
  recipe-maintainers:
    - MartinPdeS
