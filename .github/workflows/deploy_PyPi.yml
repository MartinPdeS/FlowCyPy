name: Deploy to PyPi

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  compiled_pypi_package:
    uses: MartinPdeS/MPSActions/.github/workflows/publish_compiled_package_to_PyPi.yml@v2
    with:
      python-version: "3.11"
      brew-package: fftw
      apt-package: libfftw3-double3 libfftw3-dev
      build-Linux: true
      build-macOS: true
      build-Windows: false
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
