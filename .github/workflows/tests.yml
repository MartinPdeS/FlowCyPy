name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - name: Install FFTW development dependency
        run: sudo apt-get update && sudo apt-get install -y libfftw3-dev
      - name: Set up Python and CI dependencies
        uses: MartinPdeS/MPSActions/actions/setup-python@0f5927acf88b25b5d253421e508387897096a2cc
        with:
          python-version: ${{ matrix.python }}
          install-command: >-
            python -m pip install --upgrade pip && python -m pip install -e ".[testing]"
      - run: python -m pytest -q
