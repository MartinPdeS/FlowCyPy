name: Documentation
'on':
  push:
    branches:
    - '**'
  pull_request:
    branches:
    - master
permissions:
  contents: read
jobs:
  documentation:
    permissions:
      contents: read
    uses: MartinPdeS/MPSActions/.github/workflows/build_documentation.yml@v18
    with:
      python-version: '3.11'
      package-name: FlowCyPy
      apt-package: xvfb jq libfftw3-double3 libfftw3-dev
      debug: true
